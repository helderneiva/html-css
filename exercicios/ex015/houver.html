<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Houver</title>
    <link rel="shortcut icon" href="pandadefinitivo.ico" type="image/x-icon">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        div:hover{
            color:red
        }
        div > p{
            display: none;
        }
        div:hover > p{
            display: block;
            color: white;
            background-color: red;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>Exeplo de Houver</h1>
    <p>Passe o mouse sobre o texto abaixo:</p>
    <div>Passe o Mouse aqui!
        <p>Texto Escondido</p>
    </div>
    <p>Fim do Exemplo.</p>
</body>
</html>
