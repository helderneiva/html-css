<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border: 10px solid darkgray;
            
            padding: 10px;

            margin: 20px 20px 40px 20px;

            outline: 5px dashed rgb(49, 255, 255);
        }

        a{
            border-width: 5px;
            border-style: solid;
            border-color: red;

            padding-bottom: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa Box-Level</h1>
    <p>Paragráfo também é um box-level, mas os <a href="#"><strong>link</strong></a> são exemplo de caixas Inline Level.</p>
</body>
</html>
