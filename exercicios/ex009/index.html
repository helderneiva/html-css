<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias</title>
    <link rel="shortcut icon" href="pandadefinitivo.ico" type="image/x-icon">
</head>
<body>
    <h1>Midias em HTML5</h1>
    <hr>
    <h2>Imagens Dinâmicas</h2>
    <picture>
        <source media="(max-width: 700px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">
    </picture>
    <h2>Áudios</h2>
    <p>Adicionando áudios no site:</p>
    <audio src="midia/hyoriittai.mp3" controls autoplay></audio>
    <p>Outra forma é:</p>
    <audio preload="auto" autoplay controls loop>
        <source src="midia/lamentofpiano.mp3" type="audio/mpeg">
        <source src="midia/lamentofpiano.ogg" type="audio/ogg">
        <source src="midia/lamentofpiano.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudios.&#2639; <a href="midia/lamentofpiano.mp3" download="midia/lamentofpiano.mp3" type="audio/mpeg">Clique aqui</a> para baixar o arquivo MP3.</p>
    </audio>
    <h2>Videos Hospedados Localmente</h2>
    <video src="video/Rain720.mp4" width="500" controls></video>
    <p>Coloque todos, começando pelo de menor tamanho.</p>
    <video controls width="500" poster="imagens/thumbnail.jpg">
        <source src="video/Rain720.mp4" type="video/mp4">
        <source src="video/Rain.webm" type="video/webm">
        <source src="video/Rain720.m4v" type="video/mp4">
    </video>
    <h2>Videos Externos</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/FdE5G95B7Mg?si=hHRfih99ajcUDFm5" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> 
</body>
</html>
