<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios de Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 500px;
        }

        caption{
            font-weight: bolder;
            font-size: 1.3em;
            padding: 8px;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1>Exercicios de Tabelas</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cidad">
            <col class="csex">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Idade</th>
            <th scope="col">Sexo</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>35 anos</td>
            <td>Feminino</td>
            <td>Jornalista</td>
        </tr>
        <tr class="destaque">
            <td>Fernando</td>
            <td>28 anos</td>
            <td>Masculino</td>
            <td>Secretário</td>
        </tr>
        <tr>
            <td>Claudia</td>
            <td>26 anos</td>
            <td>Feminino</td>
            <td>Policial</td>
        </tr>
        <tr>
            <td>Leo</td>
            <td>38 anos</td>
            <td>Masculino</td>
            <td>Professor</td>
        </tr>
    </table>
</body>
</html>
