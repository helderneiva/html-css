<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas 3</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
            width: 300px;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
        </tr>
        <tr>
            <td rowspan="3">D</td>
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>
        <tr>

            <td>H</td>
            
        </tr>
        <tr>
            
            <td colspan="2">K</td>
        
        </tr>
    </table>
    <h1>Desafio de Mesclagem</h1>
    <table>
        <tr>
            <td>A</td>
            <td>B</td>
            <td rowspan="2">C</td>
            <td>E</td>
        </tr>
        <tr>
            <td>F</td>
            <td>G</td>
            
            <td>I</td>
        </tr>
        <tr>
            <td colspan="3">J</td>
            
            <td>M</td>
        </tr>
        <tr>
            <td rowspan="2">N</td>
            <td colspan="2">O</td>
            
            <td>Q</td>
        </tr>
        <tr>
            
            <td>S</td>
            <td>T</td>
            <td>U</td>
        </tr>
    </table>
    <h1>Segundo Desafio</h1>
    <table>
        <tr>
            <td colspan="4">A</td>
            <td rowspan="4">B</td>
        </tr>
        <tr>
            <td rowspan="4">C</td>
            <td>D</td>
            <td>E</td>
            <td>F</td>
            
        </tr>
        <tr>
        
            <td>G</td>
            <td>H</td>
            <td>I</td>
        </tr>
        <tr>
            
            <td>J</td>
            <td>L</td>
            <td>M</td>
        </tr>
        <tr>
            
            <td colspan="4">N</td>
            
        </tr>
    </table>
</body>
</html>
